name: WARCORE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'core/**'
      - 'ui/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/warcore-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Build WARCORE debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :android:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WARCORE-Android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
